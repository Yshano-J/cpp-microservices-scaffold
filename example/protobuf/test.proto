syntax = "proto3";
package example;
//默认情况protoc命令并不会针对service服务⽣成对应rpc代码
//需要开启选项才会进⾏⽣成
option cc_generic_services = true;
// 定义⼀个消息
message Person {
  string name = 1;
  int32 age = 2;
  string email = 3;
  repeated string skills = 4;
  map<string, float> scores = 5;
}
message HelloRequest {
  string name = 1;
}
message HelloReply {
  string message = 1;
}
// 定义⼀个RPC服务
service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply) {}
}