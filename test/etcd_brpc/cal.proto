syntax = "proto3";
package cal;
option cc_generic_services = true;

message AddRequest {
  int32 a = 1;
  int32 b = 2;
};

message AddReply {
  int32 result = 1;
};

message HelloRequest {
};
message HelloResponse {
};

service CalculatorService {
  rpc Add(AddRequest) returns (AddReply);
  rpc Hello(HelloRequest) returns (HelloResponse);
};
